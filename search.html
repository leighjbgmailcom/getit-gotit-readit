<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Books — GetIt GotIt ReadIt</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="nav-brand"><span class="brand-get">GET</span>IT <span class="brand-got">GOT</span>IT <span class="brand-read">READ</span>IT</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="my-books.html">My Books</a>
        <a href="profile.html" id="nav-profile-link">Profile</a>
      </div>
      <div class="nav-actions">
        <div id="nav-auth-actions" class="row gap-sm"></div>
        <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </nav>
    <div id="nav-mobile-panel" class="nav-mobile-panel">
      <a href="index.html" data-nav>Home</a>
      <a href="search.html" data-nav>Search</a>
      <a href="my-books.html" data-nav>My Books</a>
      <a href="profile.html" data-nav>Profile</a>
      <div id="nav-mobile-auth-actions"></div>
    </div>
  </div>
</header>

<main class="page-main">
  <div class="container">
    <h1>Search Books</h1>
    <p class="text-muted">Search Open Library's full catalogue by title, author, or ISBN.</p>

    <form id="search-form" class="row gap-sm" style="margin-bottom:24px; flex-wrap:wrap;">
      <input type="search" id="search-input" placeholder="Search books by title, author or ISBN"
             style="flex:1; min-width:220px; padding:11px 16px; border:1.5px solid var(--color-border); border-radius:999px; outline:none;">
      <select id="search-mode" style="padding:11px 12px; border:1.5px solid var(--color-border); border-radius:999px; background:#fff;">
        <option value="keyword">Keyword</option>
        <option value="title">Title</option>
        <option value="author">Author</option>
        <option value="isbn">ISBN</option>
      </select>
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <div id="search-status"></div>

    <div id="filter-bar" class="hidden" style="margin-bottom:20px;">
      <p class="form-hint" style="margin-bottom:8px;">Show:</p>
      <div class="status-buttons" id="filter-buttons">
        <button class="btn-status active" data-status="none">New <span class="tab-count" id="filter-count-none">0</span></button>
        <button class="btn-status active" data-status="want">Get It <span class="tab-count" id="filter-count-want">0</span></button>
        <button class="btn-status active" data-status="have">Got It <span class="tab-count" id="filter-count-have">0</span></button>
        <button class="btn-status active" data-status="read">Read It <span class="tab-count" id="filter-count-read">0</span></button>
      </div>
    </div>

    <div id="search-results"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">GetIt GotIt ReadIt &mdash; track what you want, own, and love reading.</div>
</footer>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/books.js"></script>
<script src="js/reviews.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>
<script>
let lastResults = [];
let activeFilters = { none: true, want: true, have: true, read: true };
let searchUser = null;

const GROUP_LABELS = { none: "New", want: "Get It", have: "Got It", read: "Read It" };
const GROUP_ORDER = ["none", "want", "have", "read"];

document.addEventListener("DOMContentLoaded", async () => {
  searchUser = await getCurrentUser();

  const form = document.getElementById("search-form");
  const input = document.getElementById("search-input");
  const modeSelect = document.getElementById("search-mode");

  const initialQuery = getQueryParam("q");
  const initialMode = getQueryParam("mode");
  if (initialQuery) {
    input.value = initialQuery;
    if (initialMode) modeSelect.value = initialMode;
    runSearch(initialQuery, modeSelect.value);
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    const mode = modeSelect.value;
    history.replaceState(null, "", `search.html?q=${encodeURIComponent(q)}&mode=${mode}`);
    runSearch(q, mode);
  });

  document.querySelectorAll("#filter-buttons .btn-status").forEach((btn) => {
    btn.addEventListener("click", () => {
      const key = btn.getAttribute("data-status");
      activeFilters[key] = !activeFilters[key];
      btn.classList.toggle("active", activeFilters[key]);
      renderGroupedResults();
    });
  });
});

async function runSearch(query, mode) {
  const statusEl = document.getElementById("search-status");
  const resultsEl = document.getElementById("search-results");
  const filterBar = document.getElementById("filter-bar");
  resultsEl.innerHTML = "";
  filterBar.classList.add("hidden");
  statusEl.innerHTML = '<div class="spinner"></div>';

  const { results, error } = await searchOpenLibrary(query, mode);

  if (error) {
    statusEl.innerHTML = `<div class="empty-state">${escapeHtml(error)}</div>`;
    lastResults = [];
    return;
  }

  statusEl.innerHTML = "";

  // Tag each result with the current user's status for that book (a
  // confirmed match), or a "possibleMatch" for a close-but-not-exact
  // title match (e.g. a subtitle difference) — see matchSearchResultsToLibrary.
  if (searchUser) {
    const myLibrary = await getMyLibraryForMatching();
    matchSearchResultsToLibrary(results, myLibrary);
  } else {
    results.forEach((r) => {
      r.myStatus = null;
      r.possibleMatch = null;
    });
  }

  lastResults = results;

  if (searchUser && results.length > 0) {
    filterBar.classList.remove("hidden");
    // Reset filters to "show everything" on each new search.
    activeFilters = { none: true, want: true, have: true, read: true };
    document.querySelectorAll("#filter-buttons .btn-status").forEach((btn) => btn.classList.add("active"));
  }

  renderGroupedResults();
}

function renderGroupedResults() {
  const resultsEl = document.getElementById("search-results");

  if (lastResults.length === 0) {
    resultsEl.innerHTML = "";
    return;
  }

  // Not logged in (or nothing tagged yet): just show the plain grid,
  // filters/grouping aren't meaningful without any statuses to show.
  if (!searchUser) {
    renderBookGrid(resultsEl, lastResults, { emptyMessage: "No books found. Try a different search." });
    return;
  }

  const groups = { none: [], want: [], have: [], read: [] };
  for (const r of lastResults) {
    groups[r.myStatus || "none"].push(r);
  }

  GROUP_ORDER.forEach((key) => {
    const countEl = document.getElementById(`filter-count-${key}`);
    if (countEl) countEl.textContent = groups[key].length;
  });

  const visibleGroups = GROUP_ORDER.filter((key) => activeFilters[key] && groups[key].length > 0);

  if (visibleGroups.length === 0) {
    resultsEl.innerHTML = `<div class="empty-state">No results match the selected filters.</div>`;
    return;
  }

  resultsEl.innerHTML = visibleGroups
    .map(
      (key) => `
      <div class="section">
        <div class="section-header"><h2>${escapeHtml(GROUP_LABELS[key])} <span class="tab-count">${groups[key].length}</span></h2></div>
        <div class="book-grid">
          ${groups[key].map((book) => renderResultCard(book)).join("")}
        </div>
      </div>
    `
    )
    .join("");

  resultsEl.querySelectorAll(".compare-match-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const result = lastResults.find((r) => r.openlibrary_work_id === btn.getAttribute("data-work-id"));
      if (result && result.possibleMatch) openCompareModal(result);
    });
  });
}

/** A search result card, with an extra "possibly already have this?" note when applicable. */
function renderResultCard(book) {
  const cardHtml = renderBookCard(book, { status: book.myStatus });
  let noteHtml = "";
  if (!book.myStatus && book.possibleMatch) {
    noteHtml = `
      <div class="possible-match-note">
        Might already have this as "${escapeHtml(book.possibleMatch.title)}"?
        <button type="button" class="compare-match-btn" data-work-id="${escapeHtml(book.openlibrary_work_id)}">Compare</button>
      </div>
    `;
  }
  return `<div>${cardHtml}${noteHtml}</div>`;
}

/** Side-by-side cover comparison dialog for a "possible match" result. */
function openCompareModal(result) {
  const entry = result.possibleMatch;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:420px;">
      <h3 style="margin-bottom:4px;">Is this the same book?</h3>
      <p class="text-muted" style="font-size:0.85rem; margin-bottom:0;">We noticed a close title match already in your library.</p>
      <div class="compare-covers">
        <div class="compare-cover-col">
          <div class="compare-cover-label">Search result</div>
          ${result.cover_url ? `<img src="${escapeHtml(result.cover_url)}" alt="">` : getCoverPlaceholderHtml()}
          <div class="compare-cover-title">${escapeHtml(result.title)}</div>
          <div class="compare-cover-author">${escapeHtml(result.author || "")}</div>
        </div>
        <div class="compare-cover-col">
          <div class="compare-cover-label">In your library &middot; ${escapeHtml(STATUS_LABELS[entry.status])}</div>
          ${entry.coverUrl ? `<img src="${escapeHtml(entry.coverUrl)}" alt="">` : getCoverPlaceholderHtml()}
          <div class="compare-cover-title">${escapeHtml(entry.title)}</div>
          <div class="compare-cover-author">${escapeHtml(entry.author || "")}</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="compare-no-btn" type="button">No, different book</button>
        <button class="btn btn-primary" id="compare-yes-btn" type="button">Yes, same book</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) close();
  });
  overlay.querySelector("#compare-no-btn").addEventListener("click", close);

  overlay.querySelector("#compare-yes-btn").addEventListener("click", async () => {
    const yesBtn = overlay.querySelector("#compare-yes-btn");
    yesBtn.disabled = true;
    yesBtn.textContent = "Linking…";

    const { error } = await confirmBookCoverMatch(entry.bookId, {
      openlibrary_work_id: result.openlibrary_work_id,
      cover_url: result.cover_url,
      first_publish_year: result.first_publish_year,
    });

    if (error) {
      showToast(error, "error");
      yesBtn.disabled = false;
      yesBtn.textContent = "Yes, same book";
      return;
    }

    close();
    showToast("Linked! This will show as already tagged from now on.", "success");

    result.myStatus = entry.status;
    result.matchedEntry = entry;
    result.possibleMatch = null;
    renderGroupedResults();
  });
}
</script>
</body>
</html>
