<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Books — GetIt GotIt ReadIt</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="nav-brand"><span class="brand-get">GET</span>IT <span class="brand-got">GOT</span>IT <span class="brand-read">READ</span>IT</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="author.html">Find an Author</a>
        <a href="my-books.html">My Books</a>
        <a href="profile.html" id="nav-profile-link">Profile</a>
      </div>
      <div class="nav-actions">
        <div id="nav-auth-actions" class="row gap-sm"></div>
        <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </nav>
    <div id="nav-mobile-panel" class="nav-mobile-panel">
      <a href="index.html" data-nav>Home</a>
      <a href="search.html" data-nav>Search</a>
      <a href="author.html" data-nav>Find an Author</a>
      <a href="my-books.html" data-nav>My Books</a>
      <a href="profile.html" data-nav>Profile</a>
      <div id="nav-mobile-auth-actions"></div>
    </div>
  </div>
</header>

<main class="page-main">
  <div class="container" id="page-container">
    <h1>My Books</h1>
    <p class="text-muted">
      Everything you want, own, and have read, in one place.
      &mdash; <a href="import.html">Import from a CSV</a>
    </p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="want">Get It <span class="tab-count" id="count-want">0</span></button>
      <button class="tab-btn" data-tab="have">Got It <span class="tab-count" id="count-have">0</span></button>
      <button class="tab-btn" data-tab="read">Read It <span class="tab-count" id="count-read">0</span></button>
      <button class="tab-btn" data-tab="authors">Authors I've Read</button>
    </div>

    <div id="tab-content"><div class="spinner"></div></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">GetIt GotIt ReadIt &mdash; track what you want, own, and love reading.</div>
</footer>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/books.js"></script>
<script src="js/reviews.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>
<script>
let myBooks = { want: [], have: [], read: [] };
let activeTab = "want";

document.addEventListener("DOMContentLoaded", async () => {
  const user = await requireAuth();
  if (!user) return; // requireAuth already redirected to login

  myBooks = await getMyBooksByStatus();
  updateCounts();
  renderTab();

  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      activeTab = btn.getAttribute("data-tab");
      renderTab();
    });
  });
});

function updateCounts() {
  document.getElementById("count-want").textContent = myBooks.want.length;
  document.getElementById("count-have").textContent = myBooks.have.length;
  document.getElementById("count-read").textContent = myBooks.read.length;
}

function renderTab() {
  const contentEl = document.getElementById("tab-content");

  if (activeTab === "authors") {
    renderAuthorsTab(contentEl);
    return;
  }

  const rows = myBooks[activeTab];

  if (!rows || rows.length === 0) {
    const emptyMessages = {
      want: "No books on your Get It list yet. <a href=\"search.html\">Search for one</a> to add it.",
      have: "No books marked as Got It yet.",
      read: "No books marked as Read It yet.",
    };
    contentEl.innerHTML = `<div class="empty-state">${emptyMessages[activeTab]}</div>`;
    return;
  }

  contentEl.innerHTML = `<div class="book-grid" id="book-grid"></div>`;
  const gridEl = document.getElementById("book-grid");

  gridEl.innerHTML = rows
    .map((row) => {
      const book = row.books;
      const detailBits = [];
      if (row.format) detailBits.push(escapeHtml(row.format));
      if (row.location) detailBits.push(escapeHtml(row.location));
      const detailHtml = detailBits.length
        ? `<div class="text-center text-muted" style="font-size:0.78rem; margin-top:2px;">${detailBits.join(" &middot; ")}</div>`
        : "";
      return `
        <div class="book-card-wrap">
          ${renderBookCard(book, { status: row.status })}
          <div class="status-buttons" style="margin-top:8px; justify-content:center;" data-book-id="${book.id}">
            <button class="btn-status btn-sm ${row.status === "want" ? "active" : ""}" data-status="want">Get It</button>
            <button class="btn-status btn-sm ${row.status === "have" ? "active" : ""}" data-status="have">Got It</button>
            <button class="btn-status btn-sm ${row.status === "read" ? "active" : ""}" data-status="read">Read It</button>
          </div>
          ${detailHtml}
          <div class="text-center" style="margin-top:4px;">
            <a href="book.html?id=${book.id}" class="btn btn-ghost btn-sm">Details</a>
            <button class="btn btn-ghost btn-sm remove-book-btn" data-book-id="${book.id}" data-book-title="${escapeHtml(book.title)}">Remove</button>
          </div>
        </div>
      `;
    })
    .join("");

  gridEl.querySelectorAll(".status-buttons").forEach((group) => {
    const bookId = group.getAttribute("data-book-id");
    group.querySelectorAll(".btn-status").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const status = btn.getAttribute("data-status");
        btn.disabled = true;
        const { error } = await setBookStatus(bookId, status);
        btn.disabled = false;
        if (error) {
          showToast(error, "error");
          return;
        }
        showToast(`Moved to ${STATUS_LABELS[status]}.`, "success");
        myBooks = await getMyBooksByStatus();
        updateCounts();
        renderTab();
      });
    });
  });

  gridEl.querySelectorAll(".remove-book-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const bookId = btn.getAttribute("data-book-id");
      const title = btn.getAttribute("data-book-title");
      if (!confirm(`Remove "${title}" from your list? This won't affect anyone else's library.`)) return;

      btn.disabled = true;
      const { error } = await removeBookStatus(bookId);
      if (error) {
        showToast(error, "error");
        btn.disabled = false;
        return;
      }
      showToast("Removed from your list.", "success");
      myBooks = await getMyBooksByStatus();
      updateCounts();
      renderTab();
    });
  });
}

/**
 * "Authors I've Read" leaderboard: how many books read per author,
 * most to fewest — helps spot reading favourites. Pure client-side
 * aggregation of myBooks.read, which is already loaded.
 */
function renderAuthorsTab(contentEl) {
  const readRows = myBooks.read || [];

  if (readRows.length === 0) {
    contentEl.innerHTML = `<div class="empty-state">No books marked as Read It yet. Once you do, your most-read authors will show up here.</div>`;
    return;
  }

  const counts = new Map(); // author name -> count
  for (const row of readRows) {
    const book = row.books;
    if (!book || !book.author) continue;
    // A book can list multiple authors ("Author One, Author Two") —
    // credit each one individually toward their own tally.
    book.author
      .split(",")
      .map((a) => a.trim())
      .filter(Boolean)
      .forEach((name) => counts.set(name, (counts.get(name) || 0) + 1));
  }

  const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

  if (sorted.length === 0) {
    contentEl.innerHTML = `<div class="empty-state">No author information available for your read books yet.</div>`;
    return;
  }

  contentEl.innerHTML = `
    <p class="text-muted" style="margin-bottom:14px;">Based on your ${readRows.length} Read It book${readRows.length === 1 ? "" : "s"}, sorted most to fewest.</p>
    <div class="card" style="overflow:hidden;">
      ${sorted
        .map(
          ([author, count], i) => `
        <div class="row" style="justify-content:space-between; padding:12px 18px; ${i > 0 ? "border-top:1px solid var(--color-border);" : ""}">
          <div class="row gap-sm" style="align-items:baseline;">
            <span class="text-muted" style="font-size:0.85rem; min-width:24px;">${i + 1}.</span>
            <a href="search.html?q=${encodeURIComponent(author)}&mode=author">${escapeHtml(author)}</a>
          </div>
          <span class="tab-count">${count} book${count === 1 ? "" : "s"}</span>
        </div>
      `
        )
        .join("")}
    </div>
  `;
}
</script>
</body>
</html>
